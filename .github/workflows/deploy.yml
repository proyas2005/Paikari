name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_USER: s20230204015
  DEPLOY_HOST: 187.52.122.100

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Use PHP 8.4, same as the server
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f ../backend/public/app/index.html

      - name: Create release package
        run: |
          tar -czf release.tar.gz \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='node_modules' \
            -C backend .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.SSH_PRIVATE_KEY }}' > ~/.ssh/cse3100_deploy
          chmod 600 ~/.ssh/cse3100_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        run: |
          scp -i ~/.ssh/cse3100_deploy \
            -o IdentitiesOnly=yes \
            release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:~/release.tar.gz"

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/cse3100_deploy \
            -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'EOF'
            set -e

            mkdir -p ~/laravel

            tar -xzf ~/release.tar.gz -C ~/laravel

            chmod -R u+rwX ~/laravel/storage
            chmod -R u+rwX ~/laravel/bootstrap/cache

            cd ~/laravel

            php artisan migrate --force
            php artisan optimize

            rm -f ~/release.tar.gz
          EOF