<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 64" role="img" aria-labelledby="paikariTitle" preserveAspectRatio="xMidYMid meet">
  <title id="paikariTitle">Paikari</title>
  <defs>
    <linearGradient id="pkGradH" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softShadowH" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- left emblem: circular badge with P monogram -->
  <g transform="translate(12,8)">
    <circle cx="22" cy="22" r="20" fill="url(#pkGradH)" filter="url(#softShadowH)" />
    <g fill="#fff">
      <!-- P monogram: stem + bowl -->
      <rect x="16" y="12" width="4" height="20" rx="2" />
      <path d="M20 12h6a6 6 0 1 1 0 12h-6z" />
    </g>
  </g>

  <!-- right wordmark -->
  <g transform="translate(60,40)">
    <text x="0" y="0" fill="#0f172a" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial" font-weight="800" font-size="28">Paikari</text>
  </g>
</svg>
